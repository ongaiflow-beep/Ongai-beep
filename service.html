<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta id="meta-desc" name="description" content="Ongai Flow — Service detail.">
  <title id="page-title">Service — Ongai Flow.</title>

  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=excon@400,700,900&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>

  <style>
    :root{--y:#DAED00;--dk:#141105;--wh:#FFFFFF;--font-display:'Excon','Barlow Condensed',sans-serif;--font-body:'Satoshi','Plus Jakarta Sans',system-ui,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    a{color:inherit;text-decoration:none;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-body);background:var(--wh);color:var(--dk);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
    .text-y{color:var(--y);}
    .px-site{padding-left:clamp(1.5rem,5vw,4rem);padding-right:clamp(1.5rem,5vw,4rem);}
    .h-hero{font-family:var(--font-display);font-weight:900;font-size:clamp(2.6rem,6vw,7rem);line-height:.92;letter-spacing:-.02em;}
    .h-xl{font-family:var(--font-display);font-weight:900;font-size:clamp(1.9rem,4.5vw,5rem);line-height:.95;}
    .h-section{font-family:var(--font-display);font-weight:900;font-size:clamp(1.6rem,3vw,3rem);line-height:.98;letter-spacing:-.02em;}
    ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:var(--y);border-radius:4px;}

    /* ── Nav ── */
    #nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:1.5rem 3rem;display:flex;align-items:center;justify-content:space-between;transition:transform .4s cubic-bezier(.22,1,.36,1),background .35s ease,border-color .35s ease;}
    #nav.scrolled-light{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);}
    #nav.scrolled-dark{background:rgba(20,17,5,.88);backdrop-filter:blur(14px);}
    #nav[data-theme="light"]{border-bottom:1px solid rgba(20,17,5,.08);}
    #nav[data-theme="light"] .nav-link{color:rgba(20,17,5,.45);}
    #nav[data-theme="light"] .nav-link:hover{color:var(--dk);}
    #nav[data-theme="light"] .ham-line{background:var(--dk);}
    #nav[data-theme="dark"]{border-bottom:none;}
    #nav[data-theme="dark"] .nav-link{color:rgba(255,255,255,.45);}
    #nav[data-theme="dark"] .nav-link:hover{color:var(--wh);}
    #nav[data-theme="dark"] .ham-line{background:var(--wh);}
    /* Adaptive nav logo: dark on light bg, lime green on dark/black bg */
    #logo-mark{color:var(--dk);transition:color .35s ease;} #nav[data-theme="dark"] #logo-mark{color:var(--y);}
    .logo-custom{position:relative;display:inline-flex;align-items:center;}
    .logo-lime{position:absolute;inset:0;display:none;background:var(--y);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;}
    #nav[data-theme="dark"] .logo-natural{visibility:hidden;} #nav[data-theme="dark"] .logo-lime{display:block;}
    .nav-link{font-family:var(--font-body);font-size:.875rem;position:relative;transition:color .25s ease;}
    .nav-link::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1px;background:var(--y);transition:width .3s ease;}
    .nav-link:hover::after,.nav-link.active::after{width:100%;}
    .nav-cta{font-family:var(--font-body);font-weight:600;font-size:.875rem;background:var(--y);color:var(--dk);padding:.6rem 1.4rem;border-radius:9999px;transition:background .2s ease,color .2s ease;}
    .nav-cta:hover{background:var(--dk);color:var(--wh);}
    .ham-line{display:block;width:24px;height:2px;transition:transform .3s ease,opacity .3s ease;}
    #ham[aria-expanded="true"] #hl1{transform:translateY(6px) rotate(45deg);}
    #ham[aria-expanded="true"] #hl2{opacity:0;}
    #ham[aria-expanded="true"] #hl3{transform:translateY(-6px) rotate(-45deg);}
    #mob-menu{position:fixed;inset:0;z-index:45;background:var(--dk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;opacity:0;pointer-events:none;transition:opacity .3s ease;}
    #mob-menu.open{opacity:1;pointer-events:all;}
    .mob-link{font-family:var(--font-display);font-weight:900;font-size:clamp(2.2rem,8vw,3.5rem);color:rgba(255,255,255,.6);transition:color .2s ease;}
    .mob-link:hover{color:var(--y);}

    /* ── Service hero ── */
    .svc-hero{position:relative;min-height:80vh;display:flex;align-items:flex-end;overflow:hidden;background:var(--dk);}
    .svc-hero-img{position:absolute;inset:0;width:100%;height:108%;object-fit:cover;transform:translateY(-4%);will-change:transform;}
    @keyframes kenBurns{from{transform:translateY(-4%) scale(1);}to{transform:translateY(-4%) scale(1.06);}}
    .svc-hero-img{animation:kenBurns 10s ease forwards;}
    .svc-hero-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,17,5,.94) 0%,rgba(20,17,5,.45) 55%,rgba(20,17,5,.12) 100%);}
    .case-label{font-family:var(--font-body);font-size:.67rem;letter-spacing:.28em;text-transform:uppercase;display:block;}
    .case-body{font-family:var(--font-body);font-size:1.05rem;line-height:1.85;color:rgba(20,17,5,.72);}

    @media(min-width:1024px){.svc-aside-col{display:grid;grid-template-columns:220px 1fr;gap:5rem;align-items:start;}}

    /* ── Other services strip (services-package "strip line" look) ── */
    .svc-row{display:grid;gap:0;border-top:1px solid rgba(20,17,5,.07);border-left:1px solid rgba(20,17,5,.07);}
    @media(min-width:768px){.svc-row{grid-template-columns:1fr 1fr;}}
    .svc-item{display:block;padding:2.5rem;border-bottom:1px solid rgba(20,17,5,.07);border-right:1px solid rgba(20,17,5,.07);transition:background .22s ease;cursor:pointer;}
    .svc-item:hover{background:var(--y);}
    .svc-item:hover .svc-n,.svc-item:hover .svc-t,.svc-item:hover .svc-arr{color:var(--dk);}
    .svc-n{font-family:var(--font-body);color:rgba(20,17,5,.3);font-size:.68rem;letter-spacing:.12em;transition:color .22s ease;margin-bottom:1rem;}
    .svc-t{font-family:var(--font-body);font-weight:400;font-size:clamp(1.3rem,2.4vw,1.8rem);color:var(--dk);line-height:1.1;transition:color .22s ease;}
    .svc-arr{color:rgba(20,17,5,.2);font-size:1.2rem;margin-top:1.5rem;display:inline-block;transition:color .22s ease,transform .22s ease;}
    .svc-item:hover .svc-arr{transform:translateX(4px);}

    /* ── Contact form ── */
    .field{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.15);color:var(--wh);font-family:var(--font-body);font-size:1rem;padding:.875rem 0;outline:none;transition:border-color .2s ease;-webkit-appearance:none;}
    .field::placeholder{color:rgba(255,255,255,.65);}
    .field:focus{border-bottom-color:var(--y);}
    select.field option{background:var(--dk);}
    select.field:has(option[value=""]:checked){color:rgba(255,255,255,.65);}
    input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,textarea:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--dk) inset !important;-webkit-text-fill-color:#fff !important;caret-color:#fff;transition:background-color 9999s ease;}
    .btn-send{display:inline-flex;align-self:flex-start;align-items:center;gap:.6rem;background:var(--y);color:var(--dk);font-family:var(--font-body);font-weight:700;font-size:.95rem;padding:.875rem 2rem;border-radius:9999px;border:none;cursor:pointer;transition:background .2s ease;margin-top:.5rem;}
    .btn-send:hover:not(:disabled){background:var(--wh);}
    .btn-send:disabled{opacity:.6;cursor:wait;}
    .form-msg{font-family:var(--font-body);font-size:.95rem;margin-top:1.5rem;}
    .form-msg.ok{color:var(--y);} .form-msg.err{color:#ff6b6b;}

    /* ── Reveal ── */
    .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1);}
    .reveal.in{opacity:1;transform:none;}
    @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}
  </style>
</head>
<body>

<a href="#svc-main" style="position:absolute;top:1rem;left:1rem;z-index:999;background:var(--y);color:var(--dk);padding:.5rem 1rem;border-radius:9999px;font-family:var(--font-body);font-size:.875rem;opacity:0;pointer-events:none;transition:opacity .2s;" onfocus="this.style.opacity='1';this.style.pointerEvents='auto';" onblur="this.style.opacity='0';this.style.pointerEvents='none';">Skip to content</a>

<nav id="nav" data-theme="dark" aria-label="Main navigation">
  <a href="index.html" style="display:flex;align-items:center;gap:.7rem;" aria-label="Ongai Flow home">
    <svg id="logo-mark" width="42" height="28" viewBox="0 0 42 28" fill="none" aria-hidden="true">
      <circle cx="14" cy="14" r="10" stroke="currentColor" stroke-width="3.5" fill="none"/>
      <line x1="31" y1="6"  x2="31" y2="22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="24.1" y1="10" x2="37.9" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="37.9" y1="10" x2="24.1" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </a>
  <div class="hidden md:flex items-center" style="gap:2.25rem;">
    <a href="index.html"    class="nav-link">Home</a>
    <a href="work.html"     class="nav-link">Work</a>
    <a href="services.html" class="nav-link active">Services</a>
    <a href="about.html"    class="nav-link">About</a>
    <a href="#contact"      class="nav-cta" style="margin-left:.25rem;">Let's talk</a>
  </div>
  <button id="ham" aria-label="Open menu" aria-expanded="false" aria-controls="mob-menu"
          style="display:none;flex-direction:column;gap:5px;padding:.5rem;background:none;border:none;cursor:pointer;">
    <span class="ham-line" id="hl1"></span><span class="ham-line" id="hl2"></span>
    <span class="ham-line" id="hl3" style="width:16px;"></span>
  </button>
</nav>

<div id="mob-menu" role="dialog" aria-modal="true">
  <a href="index.html"    class="mob-link">Home</a>
  <a href="work.html"     class="mob-link">Work</a>
  <a href="services.html" class="mob-link">Services</a>
  <a href="about.html"    class="mob-link">About</a>
  <a href="#contact" style="margin-top:.5rem;font-family:var(--font-body);font-weight:700;font-size:1rem;background:var(--y);color:var(--dk);padding:.8rem 2.25rem;border-radius:9999px;">Let's talk</a>
</div>

<main id="svc-main">
  <div id="svc-root"></div>
</main>

<script>
(function(){

  /* ── Redirect if invalid index ── */
  var params = new URLSearchParams(window.location.search);
  var idx = parseInt(params.get('i'), 10);
  if (isNaN(idx) || !SITE.services || idx < 0 || idx >= SITE.services.length) {
    window.location.href = 'services.html';
    return;
  }
  var s     = SITE.services[idx];
  var total = SITE.services.length;

  /* ── Helpers ── */
  function h(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function nl(str){ return h(str).replace(/\n/g,'<br>'); }
  function num(i){ return (i+1<10?'0':'')+(i+1); }

  /* ── Meta ── */
  document.title = (s.title || 'Service') + ' — Ongai Flow.';
  document.getElementById('meta-desc').setAttribute('content', s.desc ? s.desc.substring(0,160) : 'Service — Ongai Flow.');

  /* ── Logo swap ── */
  if (SITE.logo && SITE.logo.image) {
    var lm = document.getElementById('logo-mark');
    if (lm) {
      var _src = SITE.logo.image;
      var wrap = document.createElement('span');
      wrap.id = 'logo-mark';
      wrap.className = 'logo-custom';
      var logoImg = document.createElement('img');
      logoImg.src = _src;
      logoImg.alt = 'Ongai Flow';
      logoImg.className = 'logo-natural';
      logoImg.style.cssText = 'height:32px;width:auto;object-fit:contain;display:block;';
      var lime = document.createElement('span');
      lime.className = 'logo-lime';
      lime.setAttribute('aria-hidden', 'true');
      lime.style.webkitMaskImage = 'url("' + _src + '")';
      lime.style.maskImage = 'url("' + _src + '")';
      wrap.appendChild(logoImg);
      wrap.appendChild(lime);
      lm.parentNode.replaceChild(wrap, lm);
    }
  }

  var html = '';

  /* ── HERO ── */
  html += '<section class="svc-hero" data-nav-theme="dark">';
  if (s.image) {
    html += '<img src="' + h(s.image) + '" alt="' + h(s.title) + '" class="svc-hero-img">';
  } else {
    html += '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;"><svg width="140" height="90" viewBox="0 0 42 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="10" stroke="rgba(218,237,0,.06)" stroke-width="3.5" fill="none"/><line x1="31" y1="6" x2="31" y2="22" stroke="rgba(218,237,0,.06)" stroke-width="2.5" stroke-linecap="round"/><line x1="24.1" y1="10" x2="37.9" y2="18" stroke="rgba(218,237,0,.06)" stroke-width="2.5" stroke-linecap="round"/><line x1="37.9" y1="10" x2="24.1" y2="18" stroke="rgba(218,237,0,.06)" stroke-width="2.5" stroke-linecap="round"/></svg></div>';
  }
  html += '<div class="svc-hero-grad" aria-hidden="true"></div>';
  html += '<div class="px-site" style="position:relative;z-index:1;width:100%;padding-top:8rem;padding-bottom:4.5rem;">';
  html += '<div style="max-width:1320px;margin:0 auto;">';
  html += '<a href="services.html" style="display:inline-flex;align-items:center;gap:.5rem;font-family:var(--font-body);font-size:.82rem;color:rgba(255,255,255,.42);margin-bottom:4rem;transition:color .2s ease;" onmouseover="this.style.color=\'rgba(255,255,255,.85)\'" onmouseout="this.style.color=\'rgba(255,255,255,.42)\'">';
  html += '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 12L6 8l4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  html += 'All services</a>';
  html += '<span style="font-family:var(--font-body);font-size:.75rem;letter-spacing:.28em;text-transform:uppercase;color:var(--y);display:block;margin-bottom:1.5rem;">Service ' + num(idx) + '</span>';
  html += '<h1 class="h-hero" style="color:var(--wh);max-width:860px;">' + h(s.title) + '</h1>';
  html += '</div></div></section>';

  /* ── DESCRIPTION ── */
  html += '<section data-nav-theme="light" style="background:var(--wh);padding:7rem 0;">';
  html += '<div class="px-site" style="max-width:1320px;margin:0 auto;">';
  html += '<div class="reveal svc-aside-col">';
  html += '<div style="padding-top:.25rem;">';
  html += '<span class="case-label" style="color:rgba(20,17,5,.32);">What it is</span>';
  html += '<div style="width:28px;height:3px;background:var(--y);margin-top:.875rem;border-radius:2px;"></div>';
  html += '</div>';
  html += '<div>';
  html += '<p class="case-body" style="font-size:1.18rem;color:rgba(20,17,5,.82);">' + nl(s.desc) + '</p>';
  html += '</div>';
  html += '</div>';
  html += '</div></section>';

  /* ── OTHER SERVICES (strip-line) ── */
  if (total > 1) {
    html += '<section data-nav-theme="light" style="background:#f7f7f5;padding:6rem 0;">';
    html += '<div class="px-site" style="max-width:1320px;margin:0 auto;">';
    html += '<span class="reveal case-label" style="color:rgba(20,17,5,.38);display:block;margin-bottom:2.5rem;">More services</span>';
    html += '<div class="svc-row reveal">';
    SITE.services.forEach(function(o, i){
      if (i === idx) return;
      html += '<a href="service.html?i=' + i + '" class="svc-item">';
      html += '<div class="svc-n">' + num(i) + '</div>';
      html += '<h2 class="svc-t">' + h(o.title) + '</h2>';
      html += '<span class="svc-arr">→</span>';
      html += '</a>';
    });
    html += '</div>';
    html += '</div></section>';
  }

  /* ── CONTACT ── */
  html += '<section id="contact" data-nav-theme="dark" style="position:relative;background:var(--dk);padding:8rem 0;overflow:hidden;">';
  html += '<div aria-hidden="true" style="position:absolute;bottom:-10%;right:-4%;font-family:var(--font-display);font-weight:900;font-size:clamp(14rem,35vw,50rem);color:var(--y);opacity:.05;line-height:.8;user-select:none;pointer-events:none;transform:translateY(10%);">*</div>';
  html += '<div class="px-site" style="max-width:1320px;margin:0 auto;position:relative;z-index:1;">';
  html += '<div id="contact-grid" style="display:grid;gap:5rem;align-items:start;">';
  html += '<div class="reveal">';
  html += '<span style="font-family:var(--font-body);color:var(--y);font-size:.67rem;letter-spacing:.28em;text-transform:uppercase;display:block;margin-bottom:2rem;">ready to get noticed?</span>';
  html += '<h2 class="h-xl" style="color:var(--wh);margin-bottom:2rem;">let\'s make<br>your brand<br><span style="color:var(--y);">noticed.</span></h2>';
  html += '<p style="font-family:var(--font-body);color:var(--wh);font-size:.95rem;line-height:1.7;max-width:340px;">Or email us at <a href="mailto:' + h(SITE.email) + '" style="color:var(--y);text-decoration:underline;text-underline-offset:3px;">' + h(SITE.email) + '</a></p>';
  html += '<div style="display:flex;align-items:center;gap:1.5rem;margin-top:3rem;">';
  html += '<a href="' + h(SITE.social.instagram) + '" style="font-family:var(--font-body);color:var(--wh);font-size:.85rem;transition:color .2s;" onmouseover="this.style.color=\'var(--y)\'" onmouseout="this.style.color=\'var(--wh)\'">Instagram</a>';
  html += '<span style="color:rgba(255,255,255,.3);">·</span>';
  html += '<a href="' + h(SITE.social.linkedin) + '" style="font-family:var(--font-body);color:var(--wh);font-size:.85rem;transition:color .2s;" onmouseover="this.style.color=\'var(--y)\'" onmouseout="this.style.color=\'var(--wh)\'">LinkedIn</a>';
  html += '<span style="color:rgba(255,255,255,.3);">·</span>';
  html += '<a href="' + h(SITE.social.behance) + '" style="font-family:var(--font-body);color:var(--wh);font-size:.85rem;transition:color .2s;" onmouseover="this.style.color=\'var(--y)\'" onmouseout="this.style.color=\'var(--wh)\'">Behance</a>';
  html += '</div></div>';
  html += '<div class="reveal" style="transition-delay:.1s;">';
  html += '<form id="contact-form" novalidate style="display:flex;flex-direction:column;gap:1.75rem;">';
  html += '<input name="name" type="text" placeholder="Your name" required class="field" autocomplete="name">';
  html += '<input name="email" type="email" placeholder="Your email" required class="field" autocomplete="email">';
  html += '<select name="service" class="field"><option value="" disabled selected>What service do you need?</option><option>Visual Identity</option><option>Brand Strategy</option><option>Other / Not sure yet</option></select>';
  html += '<textarea name="message" placeholder="Tell us about your project…" rows="4" required class="field" style="resize:none;"></textarea>';
  html += '<button type="submit" class="btn-send" id="send-btn">Send message <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8h12M10 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
  html += '</form>';
  html += '<p id="form-msg" class="form-msg" style="display:none;"></p>';
  html += '</div>';
  html += '</div></div></section>';

  document.getElementById('svc-root').innerHTML = html;

  /* ── FOOTER ── */
  document.getElementById('svc-main').insertAdjacentHTML('afterend',
    '<footer style="background:var(--dk);border-top:1px solid rgba(255,255,255,.05);padding:1.75rem 0;">' +
    '<div class="px-site" style="max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;">' +
    '<span style="font-family:var(--font-body);color:var(--wh);font-size:.78rem;">© ' + h(SITE.year) + ' Ongai Flow. All rights reserved.</span>' +
    '<div style="display:flex;align-items:center;gap:.4rem;"><span style="font-family:var(--font-body);color:var(--wh);font-size:.75rem;">branding.</span><span style="font-family:var(--font-display);font-weight:700;color:var(--y);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;">effectively.</span></div>' +
    '</div></footer>'
  );

  /* ── Nav ── */
  var nav = document.getElementById('nav');
  var lastY = 0, ticking = false, navHidden = false;
  function getTheme() {
    var t = window.scrollY + 80, th = 'dark';
    document.querySelectorAll('[data-nav-theme]').forEach(function(sec) {
      if (t >= sec.offsetTop && t < sec.offsetTop + sec.offsetHeight) th = sec.dataset.navTheme;
    });
    return th;
  }
  function upNav() {
    var y = window.scrollY, d = y - lastY, th = getTheme();
    nav.setAttribute('data-theme', th);
    nav.classList.remove('scrolled-light', 'scrolled-dark');
    if (y > 80) nav.classList.add(th === 'dark' ? 'scrolled-dark' : 'scrolled-light');
    if (y < 100) { nav.style.transform = 'translateY(0)'; navHidden = false; }
    else if (d > 8 && !navHidden)  { nav.style.transform = 'translateY(-100%)'; navHidden = true;  }
    else if (d < -8 && navHidden)  { nav.style.transform = 'translateY(0)';    navHidden = false; }
    lastY = y; ticking = false;
  }
  window.addEventListener('scroll', function(){ if (!ticking){ requestAnimationFrame(upNav); ticking = true; } }, {passive:true});
  upNav();

  /* ── Hamburger ── */
  var ham = document.getElementById('ham'), mob = document.getElementById('mob-menu');
  var mobOpen = false;
  function resizeHam(){ ham.style.display = window.innerWidth < 768 ? 'flex' : 'none'; }
  resizeHam(); window.addEventListener('resize', resizeHam);
  ham.addEventListener('click', function(){
    mobOpen = !mobOpen;
    ham.setAttribute('aria-expanded', mobOpen);
    mob.classList.toggle('open', mobOpen);
    document.body.style.overflow = mobOpen ? 'hidden' : '';
  });
  mob.querySelectorAll('a').forEach(function(a){
    a.addEventListener('click', function(){ mobOpen = false; ham.setAttribute('aria-expanded', false); mob.classList.remove('open'); document.body.style.overflow = ''; });
  });

  /* ── Contact grid responsive ── */
  var cg = document.getElementById('contact-grid');
  function resizeCG(){ cg.style.gridTemplateColumns = window.innerWidth >= 1024 ? '1fr 1fr' : '1fr'; }
  resizeCG(); window.addEventListener('resize', resizeCG);

  /* ── Contact form ── */
  var form = document.getElementById('contact-form');
  var sendBtn = document.getElementById('send-btn');
  var formMsg = document.getElementById('form-msg');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    if (SITE.formEndpoint.includes('YOUR_FORM_ID')) {
      formMsg.textContent = 'Form not configured. Email ' + SITE.email + ' directly.';
      formMsg.className = 'form-msg err';
      formMsg.style.display = 'block';
      return;
    }
    sendBtn.textContent = 'Sending…'; sendBtn.disabled = true;
    try {
      var res = await fetch(SITE.formEndpoint, { method:'POST', headers:{Accept:'application/json'}, body: new FormData(form) });
      if (res.ok) { form.style.display = 'none'; formMsg.textContent = "Message sent. We'll be in touch soon."; formMsg.className = 'form-msg ok'; }
      else throw new Error();
    } catch(err) {
      sendBtn.textContent = 'Send message'; sendBtn.disabled = false;
      formMsg.textContent = 'Something went wrong. Please email us directly.';
      formMsg.className = 'form-msg err';
    }
    formMsg.style.display = 'block';
  });

  /* ── Reveal on scroll ── */
  if ('IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
    }, { threshold: .07, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(function(el){ obs.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
  }

})();
</script>
</body>
</html>
