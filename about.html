<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Ongai Flow — Who we are, what we believe, and how we work.">
  <title>About — Ongai Flow.</title>

  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=excon@400,700,900&f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>

  <style>
    :root{--y:#DAED00;--dk:#141105;--wh:#FFFFFF;--font-display:'Excon','Barlow Condensed',sans-serif;--font-body:'Satoshi','Plus Jakarta Sans',system-ui,sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    a{color:inherit;text-decoration:none;}
    html{scroll-behavior:smooth;}
    body{font-family:var(--font-body);background:var(--wh);color:var(--dk);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
    .text-y{color:var(--y);}
    .px-site{padding-left:clamp(1.5rem,5vw,4rem);padding-right:clamp(1.5rem,5vw,4rem);}
    .h-hero{font-family:var(--font-display);font-weight:900;font-size:clamp(3rem,7vw,8rem);line-height:.9;letter-spacing:-.03em;}
    .h-xl{font-family:var(--font-display);font-weight:900;font-size:clamp(1.9rem,4.5vw,5rem);line-height:.95;}
    input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,textarea:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--dk) inset !important;-webkit-text-fill-color:#fff !important;caret-color:#fff;transition:background-color 9999s ease;}
    ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-thumb{background:var(--y);border-radius:4px;}

    #nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:1.5rem 3rem;display:flex;align-items:center;justify-content:space-between;transition:transform .4s cubic-bezier(.22,1,.36,1),background .35s ease,border-color .35s ease;}
    #nav.scrolled-light{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);}
    #nav.scrolled-dark{background:rgba(20,17,5,.88);backdrop-filter:blur(14px);}
    #nav[data-theme="light"]{border-bottom:1px solid rgba(20,17,5,.08);} #nav[data-theme="light"] .nav-link{color:rgba(20,17,5,.45);} #nav[data-theme="light"] .nav-link:hover{color:var(--dk);} #nav[data-theme="light"] .ham-line{background:var(--dk);}
    #nav[data-theme="dark"]{border-bottom:none;} #nav[data-theme="dark"] .nav-link{color:rgba(255,255,255,.45);} #nav[data-theme="dark"] .nav-link:hover{color:var(--wh);} #nav[data-theme="dark"] .ham-line{background:var(--wh);}
    /* Adaptive nav logo: dark on light bg, lime green on dark/black bg */
    #logo-mark{color:var(--dk);transition:color .35s ease;} #nav[data-theme="dark"] #logo-mark{color:var(--y);}
    .logo-custom{position:relative;display:inline-flex;align-items:center;}
    .logo-lime{position:absolute;inset:0;display:none;background:var(--y);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;}
    #nav[data-theme="dark"] .logo-natural{visibility:hidden;} #nav[data-theme="dark"] .logo-lime{display:block;}
    .nav-wordmark{font-family:var(--font-display);font-weight:900;font-size:1.1rem;letter-spacing:-.02em;text-transform:lowercase;transition:color .3s ease;}
    .nav-link{font-family:var(--font-body);font-size:.875rem;position:relative;transition:color .25s ease;}
    .nav-link::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1px;background:var(--y);transition:width .3s ease;}
    .nav-link:hover::after,.nav-link.active::after{width:100%;}
    .nav-cta{font-family:var(--font-body);font-weight:600;font-size:.875rem;background:var(--y);color:var(--dk);padding:.6rem 1.4rem;border-radius:9999px;transition:background .2s ease,color .2s ease;}
    .nav-cta:hover{background:var(--dk);color:var(--wh);}
    .ham-line{display:block;width:24px;height:2px;transition:transform .3s ease,opacity .3s ease;}
    #ham[aria-expanded="true"] #hl1{transform:translateY(6px) rotate(45deg);}
    #ham[aria-expanded="true"] #hl2{opacity:0;}
    #ham[aria-expanded="true"] #hl3{transform:translateY(-6px) rotate(-45deg);}
    #mob-menu{position:fixed;inset:0;z-index:45;background:var(--dk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;opacity:0;pointer-events:none;transition:opacity .3s ease;}
    #mob-menu.open{opacity:1;pointer-events:all;}
    .mob-link{font-family:var(--font-display);font-weight:900;font-size:clamp(2.2rem,8vw,3.5rem);color:rgba(255,255,255,.6);transition:color .2s ease;}
    .mob-link:hover{color:var(--y);}

    /* ── About: shared ── */
    .eyebrow{font-family:var(--font-body);color:rgba(20,17,5,.4);font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;display:block;}
    .brand-em{font-style:italic;color:var(--y);}

    /* Editorial 2-col with sticky label */
    .about-col{display:block;}
    @media(min-width:900px){.about-col{display:grid;grid-template-columns:220px 1fr;gap:5rem;align-items:start;}}
    .about-col-label{margin-bottom:2rem;}
    @media(min-width:900px){.about-col-label{margin-bottom:0;}}
    .about-col-label .idx{font-family:var(--font-body);font-weight:600;font-size:.72rem;letter-spacing:.16em;color:var(--y);display:block;margin-bottom:.6rem;}
    .about-col-label .lbl{font-family:var(--font-body);font-size:.92rem;color:rgba(20,17,5,.5);display:block;}

    /* Lead body */
    .lead{font-family:var(--font-body);font-weight:400;font-size:clamp(1.3rem,2vw,1.75rem);line-height:1.55;color:rgba(20,17,5,.82);max-width:40ch;text-align:justify;}
    .lead .brand-em{font-weight:500;}

    /* Hover-preview words (same font/background — just the hover interaction) */
    .hover-word{color:var(--y);font-weight:600;cursor:pointer;transition:opacity .25s ease;}
    .hover-word:hover{opacity:.72;}
    .hover-card{position:fixed;pointer-events:none;z-index:1000;opacity:0;transform:translateY(10px) scale(.95);transition:opacity .25s ease,transform .25s cubic-bezier(.34,1.56,.64,1);will-change:transform,opacity;}
    .hover-card.visible{opacity:1;transform:translateY(0) scale(1);}
    .hover-card-inner{background:var(--dk);border-radius:16px;padding:8px;box-shadow:0 25px 50px -12px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);overflow:hidden;max-width:300px;min-width:150px;}
    .hover-card img{width:280px;height:158px;object-fit:cover;border-radius:10px;display:block;background:#000;margin-bottom:2px;}
    .hover-card-title{padding:10px 8px 2px;font-size:.9rem;color:var(--wh);font-weight:600;font-family:var(--font-body);}
    .hover-card-subtitle{padding:0 8px 6px;font-size:.78rem;color:rgba(255,255,255,.5);font-family:var(--font-body);line-height:1.4;}

    /* Values list */
    .values-list{border-top:1px solid rgba(20,17,5,.1);}
    .value-row{display:flex;align-items:baseline;gap:1.75rem;padding:1.85rem 0;border-bottom:1px solid rgba(20,17,5,.1);transition:padding-left .35s cubic-bezier(.22,1,.36,1);}
    .value-row:hover{padding-left:.85rem;}
    .value-num{font-family:var(--font-body);font-size:.8rem;color:rgba(20,17,5,.3);min-width:2.4rem;transition:color .25s ease;}
    .value-row:hover .value-num{color:var(--dk);}
    .value-name{font-family:var(--font-display);font-weight:900;font-size:clamp(1.9rem,4vw,3.1rem);color:var(--dk);line-height:1;letter-spacing:-.015em;}

    /* Pull quote (dark statement) */
    .quote-mark{font-family:var(--font-display);font-weight:900;font-size:clamp(2.5rem,5vw,4rem);color:var(--y);line-height:1;display:block;margin-bottom:1.25rem;}
    .pull-quote{font-family:var(--font-display);font-weight:900;font-size:clamp(1.9rem,4.8vw,4rem);line-height:1.08;letter-spacing:-.02em;color:var(--wh);font-style:normal;max-width:16ch;}

    /* Team */
    .team-card{text-align:left;}
    .team-photo{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eeede8;display:block;margin-bottom:1rem;filter:grayscale(1);transition:filter .4s ease;}
    .team-card:hover .team-photo{filter:grayscale(0);}
    .team-ph{width:100%;aspect-ratio:3/4;background:#f4f4f1;display:flex;align-items:center;justify-content:center;margin-bottom:1rem;}

    .field{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.15);color:var(--wh);font-family:var(--font-body);font-size:1rem;padding:.875rem 0;outline:none;transition:border-color .2s ease;-webkit-appearance:none;}
    .field::placeholder{color:rgba(255,255,255,.65);}
    .field:focus{border-bottom-color:var(--y);}
    select.field option{background:var(--dk);}
    select.field:has(option[value=""]:checked){color:rgba(255,255,255,.65);}
    .btn-send{display:inline-flex;align-self:flex-start;align-items:center;gap:.6rem;background:var(--y);color:var(--dk);font-family:var(--font-body);font-weight:700;font-size:.95rem;padding:.875rem 2rem;border-radius:9999px;border:none;cursor:pointer;transition:background .2s ease;margin-top:.5rem;}
    .btn-send:hover:not(:disabled){background:var(--wh);}
    .btn-send:disabled{opacity:.6;cursor:wait;}
    .form-msg{font-family:var(--font-body);font-size:.95rem;margin-top:1.5rem;}
    .form-msg.ok{color:var(--y);} .form-msg.err{color:#ff6b6b;}

    .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1);}
    .reveal.in{opacity:1;transform:none;}
    @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}
    @media(min-width:1024px){.contact-grid{grid-template-columns:1fr 1fr;}}
  </style>
</head>
<body>

<nav id="nav" data-theme="light">
  <a href="index.html" style="display:flex;align-items:center;gap:.7rem;" aria-label="Ongai Flow home">
    <svg id="logo-mark" width="42" height="28" viewBox="0 0 42 28" fill="none" aria-hidden="true">
      <circle cx="14" cy="14" r="10" stroke="currentColor" stroke-width="3.5" fill="none"/>
      <line x1="31" y1="6"  x2="31" y2="22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="24.1" y1="10" x2="37.9" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="37.9" y1="10" x2="24.1" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>

  <div class="hidden md:flex items-center" style="gap:2.25rem;">
    <a href="index.html"    class="nav-link">Home</a>
    <a href="work.html"     class="nav-link">Work</a>
    <a href="services.html" class="nav-link">Services</a>

</nav>

<div id="mob-menu" role="dialog" aria-modal="true">
  <a href="index.html"    class="mob-link">Home</a>

<main>

  <!-- ── HERO ── (same layout/style as the other page heroes) -->
  <section data-nav-theme="light" style="background:var(--wh);padding:10rem 0 5rem;">
    <div class="px-site" style="max-width:1320px;margin:0 auto;">
      <span class="reveal" style="font-family:var(--font-body);color:rgba(20,17,5,.38);font-size:.67rem;letter-spacing:.28em;text-transform:uppercase;display:block;margin-bottom:2rem;">01 — who we are</span>
      <h1 class="h-hero reveal" id="about-headline" style="color:var(--dk);"></h1>
      <p id="about-tagline" class="reveal" style="font-family:var(--font-body);color:rgba(20,17,5,.52);font-size:1.05rem;line-height:1.75;max-width:480px;margin-top:2rem;"></p>
    </div>
  </section>

  <!-- ── MANIFESTO / BODY ── -->
  <section data-nav-theme="light" style="background:var(--wh);padding:4rem 0 8rem;">
    <div class="px-site" style="max-width:1320px;margin:0 auto;">
      <div class="about-col">
        <div class="about-col-label reveal">
          <span class="lbl">Our approach</span>
        </div>
        <p id="about-body" class="lead reveal"></p>
      </div>
    </div>
  </section>

  <!-- ── QUOTE (dark statement) ── -->
  <section id="quote-section" data-nav-theme="dark" style="background:var(--dk);padding:8rem 0;">
    <div class="px-site" style="max-width:1100px;margin:0 auto;">
      <span class="quote-mark reveal" aria-hidden="true">*</span>
      <blockquote id="about-quote" class="pull-quote reveal"></blockquote>
    </div>
  </section>

  <!-- ── VALUES ── -->
  <section data-nav-theme="light" style="background:var(--wh);padding:8rem 0;">
    <div class="px-site" style="max-width:1320px;margin:0 auto;">
      <div class="about-col">
        <div class="about-col-label reveal">
          <span class="lbl">What we stand for</span>
        </div>
        <div id="about-values" class="values-list reveal"></div>
      </div>
    </div>
  </section>

  <!-- ── TEAM PHOTO (optional) ── -->
  <div id="team-photo-wrap" style="display:none;">
    <section data-nav-theme="light" style="background:var(--wh);padding:0 0 8rem;">
      <div class="px-site" style="max-width:1320px;margin:0 auto;">
        <img id="team-photo-img" src="" alt="Ongai Flow studio" class="reveal" style="width:100%;max-height:620px;object-fit:cover;display:block;">
      </div>
    </section>
  </div>

  <!-- ── TEAM MEMBERS (optional) ── -->
  <div id="team-section" style="display:none;">
    <section data-nav-theme="light" style="background:var(--wh);padding:0 0 9rem;">
      <div class="px-site" style="max-width:1320px;margin:0 auto;">
        <div class="about-col">
          <div class="about-col-label reveal">
            <span class="lbl">The people</span>
          </div>
          <div id="team-grid" style="display:grid;gap:2.75rem 2rem;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
  (function(){
    var a = SITE.about || {};

    var hEl = document.getElementById('about-headline');
    if (hEl) {
      var hl = String(a.headline || 'flowing to\nthe core.');
      // Accent the last word in lime, like the other page heroes
      hl = hl.replace(/(^|\s)(\S+)\s*$/, function(_, sp, last){ return sp + '<span class="text-y">' + last + '</span>'; });
      hEl.innerHTML = hl.replace(/\n/g, '<br>');
    }

    var tEl = document.getElementById('about-tagline');
    if (tEl) tEl.textContent = SITE.tagline || '';

    var bEl = document.getElementById('about-body');
    if (bEl) bEl.innerHTML = a.body || '';

    var qEl = document.getElementById('about-quote');
    var qText = (a.quote || '').trim();
    if (qText) { qEl.textContent = qText; }
    else { document.getElementById('quote-section').style.display = 'none'; }

    var vEl = document.getElementById('about-values');
    (a.values || []).forEach(function(v, i){
      vEl.innerHTML += '<div class="value-row"><span class="value-num">' + String(i+1).padStart(2,'0') + '</span><span class="value-name">' + v + '</span></div>';
    });

    if (a.teamPhoto) {
      document.getElementById('team-photo-wrap').style.display = 'block';
      document.getElementById('team-photo-img').src = a.teamPhoto;
    }

    if (a.team && a.team.length) {
      document.getElementById('team-section').style.display = 'block';
      var g = document.getElementById('team-grid');
      a.team.forEach(function(m){
        var photo = m.photo
          ? '<img src="' + m.photo + '" alt="' + m.name + '" class="team-photo">'
          : '<div class="team-ph"><svg width="40" height="26" viewBox="0 0 42 28" fill="none"><circle cx="14" cy="14" r="10" stroke="rgba(20,17,5,.15)" stroke-width="3.5" fill="none"/><line x1="31" y1="6" x2="31" y2="22" stroke="rgba(20,17,5,.15)" stroke-width="2.5" stroke-linecap="round"/><line x1="24.1" y1="10" x2="37.9" y2="18" stroke="rgba(20,17,5,.15)" stroke-width="2.5" stroke-linecap="round"/><line x1="37.9" y1="10" x2="24.1" y2="18" stroke="rgba(20,17,5,.15)" stroke-width="2.5" stroke-linecap="round"/></svg></div>';
        g.innerHTML += '<div class="team-card reveal">' + photo +
          '<p style="font-family:var(--font-body);font-weight:600;font-size:1rem;color:var(--dk);">' + m.name + '</p>' +
          '<p style="font-family:var(--font-body);color:rgba(20,17,5,.4);font-size:.85rem;margin-top:.2rem;">' + m.role + '</p></div>';
      });
    }

    /* ── Hover-preview words in the body ── */
    (function(){
      var hovers = a.hovers || [];
      if (!bEl || !hovers.length) return;
      function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

      // Wrap the first occurrence of each configured word in the body
      hovers.forEach(function(h){
        if (!h.word) return;
        var re = new RegExp(escRe(h.word), 'i');
        var walker = document.createTreeWalker(bEl, NodeFilter.SHOW_TEXT, null);
        var target = null, m = null;
        while (walker.nextNode()) {
          var n = walker.currentNode;
          if (n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('hover-word')) continue;
          m = n.nodeValue.match(re);
          if (m) { target = n; break; }
        }
        if (!target) return;
        var full = m[0], before = target.nodeValue.slice(0, m.index), after = target.nodeValue.slice(m.index + full.length);
        var span = document.createElement('span');
        span.className = 'hover-word';
        span.textContent = full;
        span.setAttribute('data-title', h.title || '');
        span.setAttribute('data-subtitle', h.subtitle || '');
        span.setAttribute('data-image', h.image || '');
        var frag = document.createDocumentFragment();
        if (before) frag.appendChild(document.createTextNode(before));
        frag.appendChild(span);
        if (after) frag.appendChild(document.createTextNode(after));
        target.parentNode.replaceChild(frag, target);
      });

      var words = bEl.querySelectorAll('.hover-word');
      if (!words.length) return;
      hovers.forEach(function(h){ if (h.image) { var im = new Image(); im.src = h.image; } });

      var card = document.createElement('div');
      card.className = 'hover-card';
      card.innerHTML = '<div class="hover-card-inner"><img alt="" style="display:none;"><div class="hover-card-title"></div><div class="hover-card-subtitle"></div></div>';
      document.body.appendChild(card);
      var cImg = card.querySelector('img'), cT = card.querySelector('.hover-card-title'), cS = card.querySelector('.hover-card-subtitle');
      var vis = false;
      function place(e){
        var cw = card.offsetWidth || 296, ch = card.offsetHeight || 220, off = 20;
        var x = e.clientX - cw/2, y = e.clientY - ch - off;
        if (x + cw > window.innerWidth - 16) x = window.innerWidth - cw - 16;
        if (x < 16) x = 16;
        if (y < 16) y = e.clientY + off;
        card.style.left = x + 'px'; card.style.top = y + 'px';
      }
      words.forEach(function(el){
        el.addEventListener('mouseenter', function(e){
          cT.textContent = el.getAttribute('data-title') || '';
          cS.textContent = el.getAttribute('data-subtitle') || '';
          cS.style.display = cS.textContent ? 'block' : 'none';
          var img = el.getAttribute('data-image');
          if (img) { cImg.src = img; cImg.style.display = 'block'; } else { cImg.style.display = 'none'; }
          place(e); card.classList.add('visible'); vis = true;
        });
        el.addEventListener('mousemove', function(e){ if (vis) place(e); });
        el.addEventListener('mouseleave', function(){ card.classList.remove('visible'); vis = false; });
      });
    })();
  })();
  </script>

  <!-- ── CONTACT ── -->
  <section id="contact" data-nav-theme="dark" style="position:relative;background:var(--dk);padding:8rem 0;overflow:hidden;">
    <div aria-hidden="true" style="position:absolute;bottom:-10%;right:-4%;font-family:var(--font-display);font-weight:900;font-size:clamp(14rem,35vw,50rem);color:var(--y);opacity:.05;line-height:.8;user-select:none;pointer-events:none;transform:translateY(10%);">*</div>
    <div class="px-site" style="max-width:1320px;margin:0 auto;position:relative;z-index:1;">
      <div class="contact-grid" style="display:grid;gap:5rem;align-items:start;">
        <div class="reveal">
          <span style="font-family:var(--font-body);color:var(--y);font-size:.67rem;letter-spacing:.28em;text-transform:uppercase;display:block;margin-bottom:2rem;">ready to get noticed?</span>
          <h2 class="h-xl" style="color:var(--wh);margin-bottom:2rem;">let's make<br>your brand<br><span class="text-y">noticed.</span></h2>
          <p style="font-family:var(--font-body);color:var(--wh);font-size:.95rem;line-height:1.7;max-width:340px;">Or email us at <a href="mailto:ongaiflow@gmail.com" style="color:var(--y);text-decoration:underline;text-underline-offset:3px;">ongaiflow@gmail.com</a></p>
          <div style="display:flex;align-items:center;gap:1.5rem;margin-top:3rem;">
            <a id="l-ig" href="#" style="font-family:var(--font-body);color:var(--wh);font-size:.85rem;transition:color .2s;" onmouseover="this.style.color='var(--y)'" onmouseout="this.style.color='var(--wh)'">Instagram</a>
            <span style="color:rgba(255,255,255,.3);">·</span>
            <a id="l-li" href="#" style="font-family:var(--font-body);color:var(--wh);font-size:.85rem;transition:color .2s;" onmouseover="this.style.color='var(--y)'" onmouseout="this.style.color='var(--wh)'">LinkedIn</a>
            <span style="color:rgba(255,255,255,.3);">·</span>
            <a id="l-bh" href="#" style="font-family:var(--font-body);color:var(--wh);font-size:.85rem;transition:color .2s;" onmouseover="this.style.color='var(--y)'" onmouseout="this.style.color='var(--wh)'">Behance</a>
          </div>
        </div>
        <div class="reveal" style="transition-delay:.1s;">
          <form id="contact-form" novalidate style="display:flex;flex-direction:column;gap:1.75rem;">
            <input name="name" type="text" placeholder="Your name" required class="field">
            <input name="email" type="email" placeholder="Your email" required class="field">
            <select name="service" class="field"><option value="" disabled selected>What service do you need?</option><option>Visual Identity</option><option>Brand Strategy</option><option>Other / Not sure yet</option></select>
            <textarea name="message" placeholder="Tell us about your project…" rows="4" required class="field" style="resize:none;"></textarea>
            <button type="submit" class="btn-send" id="send-btn">Send message <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h12M10 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </form>
          <p id="form-msg" class="form-msg" style="display:none;"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer style="background:var(--dk);border-top:1px solid rgba(255,255,255,.05);padding:1.75rem 0;">
  <div class="px-site" style="max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;">
    <span id="footer-copy" style="font-family:var(--font-body);color:var(--wh);font-size:.78rem;"></span>
    <div style="display:flex;align-items:center;gap:.4rem;"><span style="font-family:var(--font-body);color:var(--wh);font-size:.75rem;">branding.</span><span style="font-family:var(--font-display);font-weight:700;color:var(--y);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;">effectively.</span></div>
  </div>
</footer>

<script>
(function(){
  if (SITE.logo && SITE.logo.image) {
    var lm = document.getElementById('logo-mark');
    if (lm) {
      var _src = SITE.logo.image;
      var wrap = document.createElement('span');
      wrap.id = 'logo-mark';
      wrap.className = 'logo-custom';
      var img = document.createElement('img');
      img.src = _src;
      img.alt = 'Ongai Flow logo';
      img.className = 'logo-natural';
      img.style.cssText = 'height:32px;width:auto;object-fit:contain;display:block;';
      var lime = document.createElement('span');
      lime.className = 'logo-lime';
      lime.setAttribute('aria-hidden', 'true');
      lime.style.webkitMaskImage = 'url("' + _src + '")';
      lime.style.maskImage = 'url("' + _src + '")';
      wrap.appendChild(img);
      wrap.appendChild(lime);
      lm.parentNode.replaceChild(wrap, lm);
    }
  }
  document.getElementById('l-ig').href=SITE.social.instagram;
  document.getElementById('l-li').href=SITE.social.linkedin;
  document.getElementById('l-bh').href=SITE.social.behance;
  document.getElementById('footer-copy').textContent='© '+SITE.year+' Ongai Flow. All rights reserved.';

  const cg=document.querySelector('.contact-grid');
  function resizeCG(){cg.style.gridTemplateColumns=window.innerWidth>=1024?'1fr 1fr':'1fr';}
  resizeCG();window.addEventListener('resize',resizeCG);

  const form=document.getElementById('contact-form'),sendBtn=document.getElementById('send-btn'),formMsg=document.getElementById('form-msg');
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    if(SITE.formEndpoint.includes('YOUR_FORM_ID')){formMsg.textContent='Form not configured. Email ongaiflow@gmail.com directly.';formMsg.className='form-msg err';formMsg.style.display='block';return;}
    sendBtn.textContent='Sending…';sendBtn.disabled=true;
    try{const res=await fetch(SITE.formEndpoint,{method:'POST',headers:{Accept:'application/json'},body:new FormData(form)});if(res.ok){form.style.display='none';formMsg.textContent="Message sent. We'll be in touch soon.";formMsg.className='form-msg ok';}else throw new Error();}
    catch{sendBtn.textContent='Send message';sendBtn.disabled=false;formMsg.textContent='Something went wrong. Please email us directly.';formMsg.className='form-msg err';}
    formMsg.style.display='block';
  });

  const nav=document.getElementById('nav'),sections=document.querySelectorAll('[data-nav-theme]');
  let lastY=0,ticking=false,hidden=false;
  function getTheme(){const t=window.scrollY+80;let th='light';sections.forEach(s=>{if(t>=s.offsetTop&&t<s.offsetTop+s.offsetHeight)th=s.dataset.navTheme;});return th;}
  function upNav(){const y=window.scrollY,d=y-lastY,th=getTheme();nav.setAttribute('data-theme',th);nav.classList.remove('scrolled-light','scrolled-dark');if(y>80)nav.classList.add(th==='dark'?'scrolled-dark':'scrolled-light');if(y<100){nav.style.transform='translateY(0)';hidden=false;}else if(d>8&&!hidden){nav.style.transform='translateY(-100%)';hidden=true;}else if(d<-8&&hidden){nav.style.transform='translateY(0)';hidden=false;}lastY=y;ticking=false;}
  window.addEventListener('scroll',function(){if(!ticking){requestAnimationFrame(upNav);ticking=true;}},{passive:true});
  upNav();

  const ham=document.getElementById('ham'),mob=document.getElementById('mob-menu');let open=false;
  function resizeHam(){ham.style.display=window.innerWidth<768?'flex':'none';}resizeHam();window.addEventListener('resize',resizeHam);
  ham.addEventListener('click',function(){open=!open;ham.setAttribute('aria-expanded',open);mob.classList.toggle('open',open);document.body.style.overflow=open?'hidden':'';});
  mob.querySelectorAll('a').forEach(a=>a.addEventListener('click',function(){open=false;ham.setAttribute('aria-expanded',false);mob.classList.remove('open');document.body.style.overflow='';}));

  const revEls=document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){const obs=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target);}});},{threshold:.07,rootMargin:'0px 0px -40px 0px'});revEls.forEach(el=>obs.observe(el));}
  else revEls.forEach(el=>el.classList.add('in'));
  setTimeout(function(){document.querySelectorAll('section:first-of-type .reveal').forEach(el=>el.classList.add('in'));},60);
})();
</script>
</body>
</html>
